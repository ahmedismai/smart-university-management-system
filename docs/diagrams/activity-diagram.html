<style>

  section { margin-bottom: 3.5rem; }
  h2 { font-family: var(--serif); font-weight: 400; font-size: 1.6rem; letter-spacing: -.01em; }
  .cap { color: var(--muted); font-size: .9rem; margin: .35rem 0 1rem; line-height: 1.5; }
  code { font-family: var(--mono); font-size: .82em; }
  .diagram-container { width: 100%; overflow-x: auto; border: 1px solid rgba(45,49,66,.12); border-radius: 6px; }
  svg { width: 100%; display: block; }
  @media print { section { break-inside: avoid; page-break-inside: avoid; } .diagram-container { overflow-x: visible; } svg { min-width: 0 !important; } }
</style>
